name: Web and Firebase validation
on:
  pull_request:
  push:
    branches: [main, feature/real-orders-auth-maps, feature/admin-web-only]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run test:public-service
      - run: npm test
      - run: npm run test:native-api
      - run: npm run test:compiled-api
        env:
          NODE_OPTIONS: --no-experimental-require-module
      - run: npm run build
      - run: npm run test:auth
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:public-web
      - run: node tests/pwa-build.browser.mjs
      - run: npm run test:admin-web
