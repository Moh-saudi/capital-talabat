name: Website and dashboard preview checks
on:
  push:
    branches: ['preview/brand-whatsapp-service']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run test:public-service
      - run: npm run test:catalog-import
      - run: npm run test:catalog-hub
      - run: npm run build
        env:
          VERCEL_ENV: preview
      - run: npx playwright install --with-deps chromium
      - run: npm run test:public-web
      - run: npm run test:admin-layout
      - run: node tests/pwa-build.browser.mjs
